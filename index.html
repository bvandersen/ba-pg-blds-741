<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width, initial-scale=1"><title>&#8203;</title><style>body{font:18px/1.6 system-ui,sans-serif;margin:2rem;background:#111;color:#ddd}a{color:#9cf}</style><body><script>async function __open(buf){const h=location.hash.slice(1);if(!h)throw new Error('missing key');const k=await crypto.subtle.importKey('raw',Uint8Array.from(atob(h.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0)),'AES-GCM',false,['decrypt']);const b=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(0,12)},k,b.slice(12));}fetch('list.bin').then(r=>r.arrayBuffer()).then(__open).then(d=>{document.body.innerHTML=new TextDecoder().decode(d);for(const a of document.querySelectorAll('a'))a.href=a.getAttribute('href').replace(/#.*$/,'')+location.hash;}).catch(()=>{document.body.textContent='Nothing here.';});</script>
